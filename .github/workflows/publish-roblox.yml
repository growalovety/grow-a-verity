name: Publish Roblox Place

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "place/Robloxverity.rbxl"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify place file
        run: |
          test -f place/Robloxverity.rbxl
          test -s place/Robloxverity.rbxl

      - name: Publish place to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          curl --fail-with-body --location --request POST \
            "https://apis.roblox.com/universes/v1/10768994585/places/103739066237284/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@place/Robloxverity.rbxl"
