name: Build and Publish Grow a Verity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloud-build/**"
      - ".github/workflows/cloud-build-test.yml"

permissions:
  contents: read

env:
  UNIVERSE_ID: "10768994585"
  PLACE_ID: "103739066237284"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.0

      - name: Verify Rojo project
        run: |
          pwd
          rojo --version
          test -f cloud-build/default.project.json
          test -f cloud-build/src/ServerScriptService/GameInit.server.lua
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("cloud-build/default.project.json")
          data = json.loads(p.read_text())
          assert data["name"]
          assert "tree" in data
          print("Project JSON parsed successfully:", p)
          PY

      - name: Build Roblox place with Rojo
        run: |
          mkdir -p build
          cd cloud-build
          rojo build -o ../build/grow-a-verity.rbxl
          cd ..
          test -s build/grow-a-verity.rbxl
          ls -lh build/grow-a-verity.rbxl

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: grow-a-verity-place
          path: build/grow-a-verity.rbxl

      - name: Publish place to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          test -n "$ROBLOX_API_KEY"

          for attempt in 1 2 3 4 5; do
            echo "Roblox publish attempt $attempt/5"

            response_file="$(mktemp)"
            set +e
            http_code=$(curl --silent --show-error --location \
              --request POST \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
              --header "x-api-key: $ROBLOX_API_KEY" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@build/grow-a-verity.rbxl")
            curl_exit=$?
            set -e

            body=$(cat "$response_file")
            rm -f "$response_file"

            echo "Roblox HTTP status: $http_code"
            if [ -n "$body" ]; then
              echo "$body"
            fi

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Roblox publish succeeded."
              exit 0
            fi

            if [ "$http_code" = "409" ] && [ "$attempt" -lt 5 ]; then
              sleep_seconds=$((attempt * 30))
              echo "Roblox is busy. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              continue
            fi

            echo "Roblox publish failed."
            exit 1
          done

          exit 1
