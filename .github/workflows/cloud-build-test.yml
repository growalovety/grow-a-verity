name: Cloud Roblox Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloud-build/**"
      - ".github/workflows/cloud-build-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.0

      - name: Build Roblox place with Rojo
        run: |
          mkdir -p build
          test -f cloud-build/cloud-build.project.json
          cd cloud-build
          rojo build cloud-build.project.json -o ../build/cloud-build-test.rbxl
          cd ..
          test -s build/cloud-build-test.rbxl
          ls -lh build/cloud-build-test.rbxl

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: cloud-build-test-place
          path: build/cloud-build-test.rbxl
