name: Cloud Roblox Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloud-build/**"
      - ".github/workflows/cloud-build-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.0

      - name: Verify Rojo project
        run: |
          pwd
          rojo --version
          test -f cloud-build/default.project.json
          ls -la cloud-build
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("cloud-build/default.project.json")
          data = json.loads(p.read_text())
          assert data["name"]
          assert "tree" in data
          print("Project JSON parsed successfully:", p)
          PY

      - name: Build Roblox place with Rojo
        run: |
          mkdir -p build
          cd cloud-build
          rojo build -o ../build/cloud-build-test.rbxl
          cd ..
          test -s build/cloud-build-test.rbxl
          ls -lh build/cloud-build-test.rbxl

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: cloud-build-test-place
          path: build/cloud-build-test.rbxl
